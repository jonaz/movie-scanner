<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #f0f2f5; 
            max-width: 600px; 
            margin: 0 auto; 
            color: #333;
        }
        h1 { margin-bottom: 20px; font-size: 1.8rem; }
        
        /* Form Elements */
        input[type="text"], input[type="password"], input[type="date"], input[type="number"], select {
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 16px; 
            background: #fff;
        }
        
        /* Buttons */
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            padding: 15px; 
            border-radius: 8px; 
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }

        /* File Input Styling */
        input[type="file"] { display: none; }
        .file-label {
            display: block;
            padding: 15px;
            background: #e9ecef;
            color: #495057;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            border: 2px dashed #ced4da;
            font-weight: 500;
        }
        .file-label:hover { background: #dee2e6; }

        /* Preview Image */
        #preview { 
            width: 100%; 
            border-radius: 8px; 
            margin-top: 15px; 
            display: none; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Status Messages */
        #status { 
            margin-top: 20px; 
            margin-bottom: 20px; 
            font-weight: 500; 
            padding: 15px; 
            border-radius: 8px; 
            line-height: 1.5;
            display: none; 
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
        .processing { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; display: block !important; }

        /* Textarea */
        textarea {
            padding: 12px;
            margin: 4px 0 8px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            background: #fff;
            font-family: inherit;
            resize: vertical;
        }

        /* Form labels (confirmation section) */
        .form-label {
            display: block;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            margin: 10px 0 2px;
        }

        /* Candidate picker cards */
        .candidate-card {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s;
        }
        .candidate-card:hover { border-color: #007bff; }
        .candidate-card.selected { border-color: #007bff; background: #f0f7ff; }
        .candidate-poster {
            width: 46px;
            height: 69px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 12px;
            flex-shrink: 0;
            background: #e9ecef;
        }
        .no-poster {
            width: 46px;
            height: 69px;
            border-radius: 4px;
            background: #e9ecef;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .candidate-info { flex: 1; min-width: 0; }
        .candidate-title { font-weight: 600; font-size: 14px; color: #333; }
        .candidate-meta { font-size: 12px; color: #666; margin-top: 2px; }

        /* Sections */
        .section {
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
        }
        h3 { margin-top: 0; color: #444; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>🎬 Movie DB Manager</h1>

    <div class="section">
        <input type="password" id="appSecret" placeholder="App Secret (or use URL path)">
    </div>

    <div id="status"></div>

    <div id="confirmSection" class="section" style="display:none;">
        <h3>🔍 Confirm &amp; Edit</h3>
        <div id="candidateList"></div>
        <span class="form-label">Title</span>
        <input type="text" id="confirmTitle">
        <span class="form-label">Format</span>
        <select id="confirmFormat">
            <option value="Bluray">Bluray</option>
            <option value="4K">4K Ultra HD</option>
            <option value="DVD">DVD</option>
            <option value="Unknown">Unknown</option>
        </select>
        <span class="form-label">Release Date</span>
        <input type="date" id="confirmReleaseDate">
        <span class="form-label">Genres</span>
        <input type="text" id="confirmGenres">
        <span class="form-label">Rating (0–10)</span>
        <input type="number" id="confirmVoteAverage" step="0.1" min="0" max="10">
        <span class="form-label">Vote Count</span>
        <input type="number" id="confirmVoteCount" min="0">
        <span class="form-label">Notes</span>
        <textarea id="confirmNotes" rows="2" placeholder="Optional notes..."></textarea>
        <button onclick="saveConfirmed()">✅ Confirm &amp; Save</button>
        <button class="secondary" onclick="cancelConfirm()" style="margin-top:8px;">↩ Cancel</button>
    </div>

    <div class="section scan-section">
        <h3>🔤 Scan Barcode</h3>
        <div id="reader" style="width: 100%; display: none; margin-bottom: 15px;"></div>
        <button id="startBarcodeBtn" onclick="startBarcodeScanner()">Open Barcode Scanner</button>
        <button id="stopBarcodeBtn" onclick="stopBarcodeScanner()" class="secondary" style="display:none;">Cancel Scanner</button>
    </div>

    <div class="section scan-section">
        <h3>📷 OCR Cover Scan</h3>
        
        <label for="cameraInput" class="file-label">
            Tap to Take Photo
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
        
        <img id="preview" alt="Preview">
        
        <button id="scanBtn" onclick="uploadPhoto()" disabled>Analyze Cover</button>
    </div>

    <div class="section scan-section">
        <h3>⌨️ Manual Entry</h3>
        <input type="text" id="manualInput" placeholder="Movie Title (e.g. The Matrix)">
        <select id="manualFormat">
            <option value="Bluray">Bluray</option>
            <option value="4K">4K Ultra HD</option>
            <option value="DVD">DVD</option>
        </select>
        <button class="secondary" onclick="manualSearch()">Add by Name</button>
    </div>

    <script>
        const secretInput = document.getElementById('appSecret');
        const fileInput = document.getElementById('cameraInput');
        const preview = document.getElementById('preview');
        const scanBtn = document.getElementById('scanBtn');
        const status = document.getElementById('status');
        let selectedFile = null;
        let html5QrcodeScanner = null;
        let currentCandidates = [];
        let selectedCandidateIdx = 0;

        // --- AUTH LOGIC ---
        const urlSecret = window.location.pathname.substring(1); 
        if (urlSecret && urlSecret.length > 0) {
            secretInput.value = urlSecret;
            localStorage.setItem('movieAppSecret', urlSecret);
			secretInput.parentElement.style.display = 'none';
        } else if(localStorage.getItem('movieAppSecret')) {
            secretInput.value = localStorage.getItem('movieAppSecret');
        }
        secretInput.addEventListener('change', () => {
            localStorage.setItem('movieAppSecret', secretInput.value);
        });

		// --- BARCODE SCANNER LOGIC ---
        let html5QrCode = null;

        function startBarcodeScanner() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('startBarcodeBtn').style.display = 'none';
            document.getElementById('stopBarcodeBtn').style.display = 'inline-block';
            showStatus("Initializing camera...", "processing");

            // Use the core Html5Qrcode class instead of the pre-built Scanner UI
            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 10, 
                qrbox: { width: 250, height: 150 },
                aspectRatio: 1.0
            };

            // STRICTLY request the rear/environment camera
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
                .then(() => {
                    showStatus("Camera active. Point at barcode.", "processing");
                })
                .catch((err) => {
                    showStatus("Camera error: " + err, "error");
                    stopBarcodeScanner();
                });
        }

        async function onScanSuccess(decodedText, decodedResult) {
            // Stop scanning immediately to prevent duplicate requests
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
            }
            
            document.getElementById('reader').style.display = 'none';
            document.getElementById('startBarcodeBtn').style.display = 'inline-block';
            document.getElementById('stopBarcodeBtn').style.display = 'none';
            
            showStatus("Barcode found: " + decodedText + ". Looking up movie...", "processing");

            await performRequest('/api/barcode', 'POST', () => {
                return JSON.stringify({ upc: decodedText });
            }, { 'Content-Type': 'application/json' });
        }

        function onScanFailure(error) { 
            // Ignore minor frame failures while it tries to find a barcode
        }

        function stopBarcodeScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                }).catch(err => {
                    console.error("Failed to stop scanner", err);
                });
            } else if (html5QrCode) {
                html5QrCode.clear();
                html5QrCode = null;
            }
            
            document.getElementById('reader').style.display = 'none';
            document.getElementById('startBarcodeBtn').style.display = 'inline-block';
            document.getElementById('stopBarcodeBtn').style.display = 'none';
            showStatus("", "hidden");
        }

        // --- OCR FILE HANDLING ---
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                preview.src = URL.createObjectURL(selectedFile);
                preview.style.display = 'block';
                scanBtn.disabled = false;
                showStatus("", "hidden"); 
                scanBtn.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // --- API CALLS ---
        async function uploadPhoto() {
            if (!selectedFile) return;
            await performRequest('/api/scan', 'POST', () => {
                const formData = new FormData();
                formData.append('image', selectedFile);
                return formData; 
            }, {});
        }

        async function manualSearch() {
            const query = document.getElementById('manualInput').value;
            const format = document.getElementById('manualFormat').value;
            if (!query) {
                showStatus("Please enter a movie title.", "error");
                return;
            }
            await performRequest('/api/search', 'POST', () => {
                return JSON.stringify({ query: query, format: format });
            }, { 'Content-Type': 'application/json' });
        }

        // Shared Request Logic
        async function performRequest(url, method, bodyBuilder, extraHeaders) {
            const secret = secretInput.value;
            if (!secret) {
                showStatus("Please enter the App Secret first.", "error");
                return;
            }

            showStatus("Processing... This may take a few seconds.", "processing");
            scanBtn.disabled = true; 
            
            try {
                const headers = { 'X-App-Secret': secret, ...extraHeaders };
                const body = bodyBuilder();
                const response = await fetch(url, { method, headers, body });
                const result = await response.json();

                if (response.ok) {
                    if (result.candidates) {
                        showConfirmation(result.candidates, result.format);
                    } else {
                        showStatus(`✅ <b>Success!</b><br>Added: ${result.title}<br>Format: ${result.format}<br>Date: ${result.releaseDate}`, "success");
                        resetForm();
                    }
                } else {
                    showStatus(`❌ <b>Error:</b> ${result.error}`, "error");
                }
            } catch (error) {
                showStatus("❌ Network Error. Check your connection or server logs.", "error");
                console.error(error);
            } finally {
                scanBtn.disabled = false;
            }
        }

        function showStatus(msg, type) {
            status.innerHTML = msg;
            status.className = type;
            if (type !== 'hidden') {
                status.style.display = 'block';
            } else {
                status.style.display = 'none';
            }
        }

        function resetForm() {
            document.getElementById('manualInput').value = "";
            if (preview.style.display === 'block') {
                preview.style.display = 'none';
                fileInput.value = "";
                selectedFile = null;
                scanBtn.disabled = true;
            }
        }

        // --- CONFIRMATION STEP ---

        function showConfirmation(candidates, defaultFormat) {
            currentCandidates = candidates;
            document.querySelectorAll('.scan-section').forEach(s => s.style.display = 'none');
            document.getElementById('confirmSection').style.display = 'block';
            showStatus('', 'hidden');
            renderCandidates(candidates);
            document.getElementById('confirmFormat').value = defaultFormat || 'Unknown';
            if (candidates.length > 0) selectCandidate(0);
            document.getElementById('confirmSection').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelConfirm() {
            document.getElementById('confirmSection').style.display = 'none';
            document.querySelectorAll('.scan-section').forEach(s => s.style.display = 'block');
            document.getElementById('confirmNotes').value = '';
            showStatus('', 'hidden');
            resetForm();
        }

        function renderCandidates(candidates) {
            const list = document.getElementById('candidateList');
            list.innerHTML = '';
            candidates.forEach((c, i) => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.onclick = () => selectCandidate(i);

                const year = c.releaseDate ? c.releaseDate.substring(0, 4) : '?';
                const posterUrl = c.posterPath
                    ? `https://image.tmdb.org/t/p/w92${c.posterPath}`
                    : null;

                if (posterUrl) {
                    const img = document.createElement('img');
                    img.src = posterUrl;
                    img.className = 'candidate-poster';
                    img.alt = '';
                    const fallback = document.createElement('div');
                    fallback.className = 'no-poster';
                    fallback.style.display = 'none';
                    fallback.textContent = '🎬';
                    img.onerror = () => { img.style.display = 'none'; fallback.style.display = 'flex'; };
                    card.appendChild(img);
                    card.appendChild(fallback);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'no-poster';
                    placeholder.textContent = '🎬';
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'candidate-info';
                info.innerHTML = `<div class="candidate-title">${escHtml(c.title)} (${escHtml(year)})</div>
                    <div class="candidate-meta">${escHtml(c.genres || '—')} · ⭐ ${c.voteAverage.toFixed(1)}</div>`;
                card.appendChild(info);
                list.appendChild(card);
            });
        }

        function selectCandidate(idx) {
            selectedCandidateIdx = idx;
            document.querySelectorAll('.candidate-card').forEach((c, i) =>
                c.classList.toggle('selected', i === idx));
            const c = currentCandidates[idx];
            document.getElementById('confirmTitle').value = c.title || '';
            document.getElementById('confirmReleaseDate').value = c.releaseDate || '';
            document.getElementById('confirmGenres').value = c.genres || '';
            document.getElementById('confirmVoteAverage').value = c.voteAverage || '';
            document.getElementById('confirmVoteCount').value = c.voteCount || '';
            // format and notes are intentionally not overwritten on candidate switch
        }

        async function saveConfirmed() {
            const title = document.getElementById('confirmTitle').value.trim();
            if (!title) { showStatus('Please enter a title.', 'error'); return; }
            const secret = secretInput.value;
            if (!secret) { showStatus('Please enter the App Secret first.', 'error'); return; }

            showStatus('Saving...', 'processing');
            try {
                const response = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-App-Secret': secret },
                    body: JSON.stringify({
                        title,
                        format: document.getElementById('confirmFormat').value,
                        releaseDate: document.getElementById('confirmReleaseDate').value,
                        genres: document.getElementById('confirmGenres').value,
                        voteAverage: parseFloat(document.getElementById('confirmVoteAverage').value) || 0,
                        voteCount: parseInt(document.getElementById('confirmVoteCount').value) || 0,
                        notes: document.getElementById('confirmNotes').value,
                    }),
                });
                const result = await response.json();
                if (response.ok) {
                    showStatus(`✅ <b>Success!</b><br>Added: ${result.title}<br>Format: ${result.format}<br>Date: ${result.releaseDate}`, 'success');
                    cancelConfirm();
                } else {
                    // On 409 (duplicate) stay in confirm mode so user can edit the title
                    showStatus(`❌ <b>Error:</b> ${result.error}`, 'error');
                }
            } catch (err) {
                showStatus('❌ Network Error. Check your connection or server logs.', 'error');
                console.error(err);
            }
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
